# nginx del contenedor (nginxinc/nginx-unprivileged): sirve dist/ en el puerto 8080.
# Caché: los assets con hash son inmutables un año; el HTML y los ficheros que cambian de nombre nunca se cachean.

map $uri $portafolios_cache {
  ~^/assets/                          "public, max-age=31536000, immutable";
  ~\.(?:html|webmanifest|xml|txt)$    "no-cache";
  ~\.(?:svg|png|ico|webp|jpg|woff2)$  "public, max-age=86400";
  default                             "no-cache";
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_comp_level 6;
  gzip_types text/plain text/css text/xml application/javascript application/json application/manifest+json image/svg+xml application/xml;

  add_header Cache-Control $portafolios_cache always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options SAMEORIGIN always;

  location ~ \.webmanifest$ {
    default_type application/manifest+json;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ =404;
  }

  error_page 404 /404.html;
}
