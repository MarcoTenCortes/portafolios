# Registro de visitas de portafolios.mtcor.es en el nginx del host (el proxy inverso con TLS que reenvia al
# contenedor del puerto 8951). Va en /etc/nginx/conf.d/ (nivel http) y no registra nada por si solo: el vhost
# lo activa con una linea (ver portafolios.vhost.example):
#
#   access_log /var/log/nginx/portafolios.visitas.log portafolios_visitas if=$portafolios_registrar;
#
# Solo se apuntan vistas de pagina: GET de / o /index.html (con o sin query) hechas por un navegador. Quedan
# fuera los assets, favicon, robots, sitemap, 404, HEAD y los bots conocidos (user-agent vacio incluido); el
# healthcheck de Docker va directo al contenedor y nunca pasa por aqui. Formato combined + Accept-Language,
# que GoAccess lee con --log-format '%h %^[%d:%t %^] "%r" %s %b "%R" "%u" "%^"' (deploy/visitas-informe.sh).
# Si algun dia hay un CDN delante (Cloudflare...), $remote_addr seria la IP del CDN: haria falta real_ip.

log_format portafolios_visitas '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent '
                               '"$http_referer" "$http_user_agent" "$http_accept_language"';

map $request_uri $portafolios_pagina {
  default                  0;
  ~^/(\?.*)?$              1;
  ~^/index\.html(\?.*)?$   1;
}

# Bots por user-agent, sin distinguir mayusculas. Es un primer filtro: GoAccess descarta ademas los crawlers
# de su propia lista (--ignore-crawlers en deploy/visitas-informe.sh).
map $http_user_agent $portafolios_bot {
  default                                            0;
  ""                                                 1;
  # buscadores y crawlers ((?<!cu) para no tomar por bot los moviles Cubot)
  ~*((?<!cu)bot|crawl|spider|slurp)                  1;
  # previsualizaciones de enlaces (Facebook, WhatsApp, Bing...)
  ~*(facebookexternalhit|whatsapp|preview)           1;
  # monitores, auditorias y navegadores sin pantalla
  ~*(monitor|uptime|pingdom|lighthouse|headless)     1;
  # clientes HTTP de linea de comandos y librerias
  ~*(curl|wget|python|go-http-client|java/|okhttp|axios|node-fetch|httpclient|scrapy)  1;
}

# 1 solo si es GET, es la pagina y no es un bot.
map "$request_method:$portafolios_pagina:$portafolios_bot" $portafolios_registrar {
  default    0;
  "GET:1:0"  1;
}
