<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 · Marco Tenorio Cortés</title>
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#05070b">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; margin: 0; }
    body {
      min-height: 100vh; display: grid; place-items: center; padding: 24px;
      background: #05070b; color: #c6cfdb; text-align: center;
      font-family: "Inter", -apple-system, "Segoe UI", Roboto, system-ui, sans-serif;
    }
    main { display: grid; gap: 16px; justify-items: center; max-width: 42ch; }
    .code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; letter-spacing: .1em; color: #2997ff; text-transform: uppercase; }
    h1 { font-size: clamp(32px, 6vw, 56px); line-height: 1.05; letter-spacing: -.02em; color: #f5f7fa; font-weight: 600; }
    p { font-size: 17px; line-height: 1.5; }
    a {
      display: inline-flex; align-items: center; min-height: 44px; padding: 10px 20px; margin-top: 8px;
      border-radius: 999px; background: #fff; color: #05070b; font-weight: 500; text-decoration: none;
    }
    a:hover { background: #e9edf3; }
  </style>
</head>
<body>
  <main>
    <p class="code">Error 404</p>
    <h1>Esta página se ha derramado.</h1>
    <p>La dirección no existe o ha cambiado. El café, por suerte, sigue en su sitio.</p>
    <a href="/">Volver al inicio</a>
  </main>
</body>
</html>
