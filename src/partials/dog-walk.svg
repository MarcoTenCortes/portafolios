        </g>
        <path d="M156 25 C177 24 193 41 191 61 C192 81 174 98 155 96 C135 98 119 80 120 60 C119 40 135 24 156 25 Z" fill="var(--ill-cream,#f3eedb)"/>
        <path d="M126 76 C136 92 160 98 182 90 C172 97 150 99 136 92 C130 88 127 82 126 76 Z" fill="#c7bfaf"/>
        <path d="M138 42 C144 32 164 30 170 42 C174 52 166 66 154 66 C142 66 134 54 138 42 Z" fill="#9c6840"/>
        <path d="M162 68 C174 64 188 68 191 80 C193 90 183 97 169 95 C160 93 158 82 162 68 Z" fill="#fbfaf1" stroke="var(--ill-ink,#151a24)" stroke-width="3" stroke-linejoin="round"/>
        <path d="M140 27 C154 19 178 22 188 40 C197 54 195 76 182 90" fill="none" stroke="var(--ill-ink,#151a24)" stroke-width="3.5" stroke-linecap="round"/>
        <path d="M182 90 C170 100 144 100 130 88 C125 84 122 80 121 76" fill="none" stroke="var(--ill-ink,#151a24)" stroke-width="5" stroke-linecap="round"/>
        <path d="M120 66 C118 52 124 36 138 28" fill="none" stroke="var(--ill-ink,#151a24)" stroke-width="4" stroke-linecap="round"/>
        <ellipse class="dog__nose" cx="184" cy="80" rx="6.5" ry="5" fill="var(--ill-ink,#151a24)"/>
        <circle cx="182" cy="78" r="1.6" fill="#fff" opacity=".8"/>
        <circle class="dog__eye" cx="156" cy="58" r="5" fill="var(--ill-ink,#151a24)"/>
        <circle cx="158" cy="56" r="1.8" fill="#fff"/>
        <ellipse class="dog__lid" cx="156" cy="58" rx="7.5" ry="7" fill="#9c6840" style="transform-origin:156px 52px;transform:scaleY(0)"/>
        <path class="dog__smile" d="M173 90 Q180 97 188 91" fill="none" stroke="var(--ill-ink,#151a24)" stroke-width="2.5" stroke-linecap="round"/>
        <g class="dog__ear dog__ear--front" style="transform-origin:150px 30px">
          <path d="M150 26 C138 20 126 28 124 42 C122 56 126 68 134 72 C142 74 148 62 146 48 C145 40 152 32 150 26 Z" fill="var(--ill-cream,#f3eedb)" stroke="var(--ill-ink,#151a24)" stroke-width="3.5" stroke-linejoin="round"/>
          <path d="M135 42 C131 52 133 62 138 67" fill="none" stroke="#c7bfaf" stroke-width="4" stroke-linecap="round"/>
        </g>
        <path d="M132 30 C148 18 174 20 188 38" fill="none" stroke="var(--action,#2997ff)" stroke-opacity=".55" stroke-width="2" stroke-linecap="round"/>
        <g class="dog__mouth" transform="translate(178 92)">
          <!-- bone held crosswise in the mouth (shown with .has-bone) -->
          <g class="dog__bone" opacity="0" transform="translate(-2 4) rotate(-12) scale(.5) translate(-60 -24)">
            <path d="M42 17 H78 A13 12.5 0 1 1 97.5 24 A12.5 13 0 1 1 78 31 H42 A12.5 13 0 1 1 22.5 24 A13 12.5 0 1 1 42 17 Z" fill="var(--ill-cream,#f3eedb)"/>
            <path d="M40 26 C54 24.5 66 24.5 80 26.5 V31 H40 Z" fill="#c7bfaf"/>
            <circle cx="30.5" cy="35.5" r="10" fill="#c7bfaf"/>
            <circle cx="90.5" cy="35.5" r="10" fill="#c7bfaf"/>
            <path d="M42 17 H78 A13 12.5 0 1 1 97.5 24 A12.5 13 0 1 1 78 31 H63 M57 31 H42 A12.5 13 0 1 1 22.5 24 A13 12.5 0 1 1 42 17 L46 16.4" fill="none" stroke="var(--ill-ink,#151a24)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>
