<svg class="dog__art" viewBox="0 0 200 160" width="144" height="115" aria-hidden="true" focusable="false" overflow="visible">
  <ellipse class="dog__shadow" cx="100" cy="152" rx="60" ry="6" fill="#000" opacity=".3"/>
  <g class="dog__flip" style="transform-origin:100px 80px">
    <g class="dog__bob">
      <!-- tail: ink under cream (stroke pair), brown tip -->
      <g class="dog__tail" style="transform-origin:36px 80px" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M48 76 C36 72 24 60 26 46" stroke="var(--ill-ink,#151a24)" stroke-width="16"/>
        <path d="M26 46 C28 34 40 32 42 42" stroke="var(--ill-ink,#151a24)" stroke-width="12"/>
        <path d="M48 76 C36 72 24 60 26 46" stroke="var(--ill-cream,#f3eedb)" stroke-width="9"/>
        <path d="M26 46 C28 34 40 32 42 42" stroke="var(--ill-cream,#f3eedb)" stroke-width="5.5"/>
        <path d="M27 43 C31 36 38 36 40 40" stroke="#9c6840" stroke-width="4.5"/>
        <path d="M44 74 C36 70 30 64 28 58" stroke="#c7bfaf" stroke-width="3"/>
      </g>
      <!-- far legs -->
      <g class="dog__leg dog__leg--back-far" style="transform-origin:61px 108px">
        <rect x="52" y="104" width="18" height="46" rx="9" fill="#d8d2c2"/>
        <path d="M52 112 V141 a9 9 0 0 0 9 9 a9 9 0 0 0 9 -9 V112" fill="none" stroke="var(--ill-ink,#151a24)" stroke-width="3" stroke-linecap="round"/>
      </g>
      <g class="dog__leg dog__leg--front-far" style="transform-origin:121px 108px">
        <rect x="112" y="104" width="18" height="46" rx="9" fill="#d8d2c2"/>
        <path d="M112 112 V141 a9 9 0 0 0 9 9 a9 9 0 0 0 9 -9 V112" fill="none" stroke="var(--ill-ink,#151a24)" stroke-width="3" stroke-linecap="round"/>
      </g>
      <!-- body -->
      <g class="dog__body">
        <rect x="42" y="62" width="110" height="60" rx="30" fill="var(--ill-cream,#f3eedb)"/>
        <path d="M46 100 C70 108 110 110 146 100 C144 114 130 122 100 122 C70 122 50 114 46 100 Z" fill="#c7bfaf"/>
        <path d="M62 68 C84 60 112 60 132 66" fill="none" stroke="#fbfaf1" stroke-width="5" stroke-linecap="round"/>
        <path d="M68 64 C84 58 106 60 114 68 C118 80 104 90 88 88 C72 86 62 74 68 64 Z" fill="#9c6840"/>
        <path d="M72 60 C96 57 118 61 124 60" fill="none" stroke="var(--ill-ink,#151a24)" stroke-width="3.5" stroke-linecap="round"/>
        <path d="M124 60 C160 60 160 122 122 120" fill="none" stroke="var(--ill-ink,#151a24)" stroke-width="4" stroke-linecap="round"/>
        <path d="M122 120 C116 122 110 121 106 121" fill="none" stroke="var(--ill-ink,#151a24)" stroke-width="5" stroke-linecap="round"/>
        <path d="M98 121 C88 122 78 119 70 120 C30 121 30 61 74 59" fill="none" stroke="var(--ill-ink,#151a24)" stroke-width="5" stroke-linecap="round"/>
        <path d="M58 64 C82 55 112 56 134 61" fill="none" stroke="var(--action,#2997ff)" stroke-opacity=".55" stroke-width="2" stroke-linecap="round"/>
      </g>
      <!-- near legs -->
      <g class="dog__leg dog__leg--back-near" style="transform-origin:75px 110px">
        <rect x="66" y="106" width="18" height="46" rx="9" fill="var(--ill-cream,#f3eedb)"/>
        <path d="M66 112 V143 a9 9 0 0 0 9 9 a9 9 0 0 0 9 -9 V112" fill="none" stroke="var(--ill-ink,#151a24)" stroke-width="3.5" stroke-linecap="round"/>
        <path d="M72 150 V146 M78 150 V146" fill="none" stroke="var(--ill-ink,#151a24)" stroke-width="2" stroke-linecap="round"/>
      </g>
      <g class="dog__leg dog__leg--front-near" style="transform-origin:135px 110px">
        <rect x="126" y="106" width="18" height="46" rx="9" fill="var(--ill-cream,#f3eedb)"/>
        <path d="M126 112 V143 a9 9 0 0 0 9 9 a9 9 0 0 0 9 -9 V112" fill="none" stroke="var(--ill-ink,#151a24)" stroke-width="3.5" stroke-linecap="round"/>
        <path d="M132 150 V146 M138 150 V146" fill="none" stroke="var(--ill-ink,#151a24)" stroke-width="2" stroke-linecap="round"/>
      </g>
      <!-- collar -->
      <g class="dog__collar">
        <rect x="112" y="84" width="34" height="12" rx="5" transform="rotate(32 129 90)" fill="var(--action,#2997ff)" stroke="var(--ill-ink,#151a24)" stroke-width="2.5"/>
        <circle cx="141" cy="101" r="4.5" fill="var(--ill-cream,#f3eedb)" stroke="var(--ill-ink,#151a24)" stroke-width="2"/>
      </g>
      <!-- head -->
      <g class="dog__head" style="transform-origin:132px 86px">
