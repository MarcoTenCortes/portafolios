# En cada push a main: tests, build del sitio e imagen Docker multiarquitectura (arm64 para el servidor, amd64
# para probar en local) publicada en GHCR como ghcr.io/marcotencortes/portafolios:latest (+ sha-<commit>).
# En el servidor, Watchtower (deploy/docker-compose.yml) recoge la imagen nueva en menos de cinco minutos.
# También se puede lanzar a mano desde cualquier rama (workflow_dispatch): entonces se etiqueta con el nombre
# de la rama y NO se toca `latest`.
name: Build & publish image

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: python3 tools/sync-html-i18n.py --check
      - run: npm run build

  image:
    name: Imagen (linux/arm64 + linux/amd64)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Login en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Etiquetas
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha,prefix=sha-
      - name: Build y push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64,linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
